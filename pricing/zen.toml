# Anthropic list pricing, in effect from 2026-09-01.
#
# The introductory rate that applied through 2026-08-31 is recorded as a period below rather
# than replaced, so an August request keeps being billed at August's price after this date
# passes. Both sides of the boundary are correct as written — there is no dated edit pending.
#
# Cache rates are not independent quantities: a read is 0.1x input and a five-minute write is
# 1.25x. Change `input` and all three move with it.
[model."claude-sonnet-5"]
input = 3.00
output = 15.00
cache_read = 0.30
cache_write = 3.75

# Introductory pricing, in effect through 2026-08-31 (UTC), inclusive.
[[model."claude-sonnet-5".period]]
through = "2026-08-31"
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

