[package]
name = "ai-usage-tui"
version = "0.13.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal dashboard that measures what each AI coding model actually costs per passing test — routing, escalation and budget analytics across Claude Code, Codex CLI, GitHub Copilot, Gemini CLI, OpenCode and Ollama, where an unknown cost stays unknown instead of rendering as $0.00. Live TUI or JSON/CSV."
license = "MIT"
authors = ["Sophana Sok <sokdevelopment@gmail.com>"]
repository = "https://github.com/SophanaSok/ai-usage-tui"
homepage = "https://github.com/SophanaSok/ai-usage-tui"
# crates.io allows five, at most 20 characters each. Deliberately generic: the source names
# live in [package.metadata.identity] topics, where there is room for all of them, and a test
# requires every keyword to also be a topic. Spending a keyword slot on one source is the
# drift this whole arrangement exists to end.
keywords = ["ai", "tui", "dashboard", "tokens", "cost"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
# Kept out of the published tarball. `tests/`, `examples/` and `pricing/` stay in: the unit tests
# under `src/` read `tests/fixtures/` at runtime, `src/config.rs` includes `examples/config.toml`,
# and `src/pricing.rs` includes `pricing/zen.toml` at compile time -- so a packaged crate has to
# carry all three to build and test. What is left is 670KB of README screenshots, which crates.io
# resolves against the repository anyway, and CI/dev scripts nobody consuming the crate needs.
exclude = ["docs/assets/*", ".github/*", "scripts/*", "dist/*"]

# What GitHub's About box must show. crates.io reads [package] directly, so it and this manifest
# cannot disagree by construction; GitHub has no manifest, so .github/workflows/identity.yml
# pushes these and fails the build when they drift.
[package.metadata.identity]
# GitHub allows 20 topics; each must be lowercase alphanumerics and hyphens, at most 50 chars.
# Must be a superset of `keywords`, and must carry a slug for every row-contributing source in
# src/collector/registry.rs -- both enforced by tests/docs.rs. That second rule is the forcing
# function: a collector cannot be added without its topic.
topics = [
    "ai", "tui", "dashboard", "tokens", "cost",
    "claude-code", "codex-cli", "github-copilot", "gemini-cli", "opencode", "ollama",
    "rust", "cli", "ratatui", "llm", "token-usage", "cost-tracking",
    "ai-agents", "terminal",
]
# GitHub's "About" homepage slot. Deliberately not the repository URL -- a visitor is already on
# that page. The install page is the one link the About box can give them that the page cannot,
# and it is the literal statement that GitHub and crates.io are the same project.
github_homepage = "https://crates.io/crates/ai-usage-tui"

# The release binary was built with cargo's stock release profile: no LTO, 16 codegen units and
# symbols left in. CI strips on Unix as a separate step and not on Windows, so the Windows archive
# shipped a binary several MB larger than the others for no reason.
#
# `lto = "thin"` rather than "fat": thin gets most of the size win at a fraction of the link time,
# which matters because `just check` and the six-target release matrix both pay it.
#
# Deliberately NOT `panic = "abort"`, which is the usual fourth line here and would break two
# things. `run_tui` wraps the event loop in `catch_unwind` so the terminal is restored before the
# unwind resumes -- with abort there is no unwind and a panic leaves the user in a raw-mode
# alternate screen. And `background.rs` catches a panicking collector and restarts it with
# backoff, so abort would turn one bad source into a dead process.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

# `cargo binstall ai-usage-tui` -- fetch the release archive instead of compiling. The slug in the
# archive name is not derivable from the target triple, so each target the release matrix builds
# names its own URL. Keep this in step with the matrix in .github/workflows/release.yml.
[package.metadata.binstall]
# The binary sits at the archive root, beside README.md and LICENSE.
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-linux.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-linux.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-macos.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-macos.tar.gz"
pkg-fmt = "tgz"

# The Windows binary is built for the gnu triple but runs on any x86_64 Windows, and almost every
# Rust user on Windows is on msvc -- so both triples point at the one published zip.
[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-windows.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-windows.zip"
pkg-fmt = "zip"

[package.metadata.deb]
maintainer = "Sophana Sok <sokdevelopment@gmail.com>"
copyright = "2026, Sophana Sok <sokdevelopment@gmail.com>"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utils"
priority = "optional"
# `dist/` is generated -- `just assets`, and the release workflow does it before packaging.
# cargo-deb fails if a listed asset is missing, which is the behaviour we want: a package that
# silently lost its completions would be discovered by a user, not by CI.
assets = [
    ["target/release/ai-usage-tui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ai-usage-tui/", "644"],
    ["LICENSE", "usr/share/doc/ai-usage-tui/", "644"],
    ["dist/ai-usage-tui.1", "usr/share/man/man1/", "644"],
    ["dist/completions/ai-usage-tui.bash", "usr/share/bash-completion/completions/ai-usage-tui", "644"],
    ["dist/completions/_ai-usage-tui", "usr/share/zsh/site-functions/_ai-usage-tui", "644"],
    ["dist/completions/ai-usage-tui.fish", "usr/share/fish/vendor_completions.d/ai-usage-tui.fish", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
release = "1"
assets = [
    { source = "target/release/ai-usage-tui", dest = "/usr/bin/ai-usage-tui", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/ai-usage-tui/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/ai-usage-tui/LICENSE", mode = "644" },
    { source = "dist/ai-usage-tui.1", dest = "/usr/share/man/man1/ai-usage-tui.1", mode = "644" },
    { source = "dist/completions/ai-usage-tui.bash", dest = "/usr/share/bash-completion/completions/ai-usage-tui", mode = "644" },
    { source = "dist/completions/_ai-usage-tui", dest = "/usr/share/zsh/site-functions/_ai-usage-tui", mode = "644" },
    { source = "dist/completions/ai-usage-tui.fish", dest = "/usr/share/fish/vendor_completions.d/ai-usage-tui.fish", mode = "644" },
]
