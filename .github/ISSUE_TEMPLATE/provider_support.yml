name: Support another tool's usage data
description: Ask for a new collector — Codex, Gemini CLI, Aider, or anything else.
labels: [enhancement, collector]
body:
  - type: markdown
    attributes:
      value: |
        Collectors are the most valuable contribution to this project, and the `Collector` trait
        is a small seam — see the guide in
        [CONTRIBUTING.md](https://github.com/SophanaSok/ai-usage-tui/blob/main/CONTRIBUTING.md).

        What matters most below is **where the data lives and what shape it is**. That is the
        part only someone who uses the tool can answer.
  - type: input
    id: tool
    attributes:
      label: Which tool
      placeholder: OpenAI Codex CLI
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where does it store usage data
      description: Paths, and whether it is SQLite, JSONL, JSON, or something else.
      placeholder: "~/.codex/sessions/*.jsonl — one JSON object per line"
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What does a usage record look like
      description: |
        **Redact it first.** We need the field names and shape, not your content — token counts,
        model id, timestamp, and any request id used for deduplication. Replace text with `...`.
      render: json
  - type: checkboxes
    id: fields
    attributes:
      label: Which does it record
      options:
        - label: Input and output token counts
        - label: Cache read / cache write tokens
        - label: A cost figure from the provider
        - label: A stable per-request id (needed for deduplication)
        - label: Working directory or project (enables per-project cost)
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: Any sample above is redacted and contains no prompts, completions, or secrets.
          required: true
