name: Bug report
description: A number looks wrong, something crashed, or the dashboard misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not paste raw session logs, database contents, or `--json` output from your
        real usage.** Those contain source code, file paths, and sometimes secrets. Almost every
        bug here can be reproduced against the committed fixture:

        ```sh
        ai-usage-tui --json --all --db tests/fixtures/opencode_test.db --claude-dir /nonexistent
        ```

        If a bug genuinely needs your data to reproduce, say so and we will work out a redacted
        way to share it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command, ideally against the fixture database.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ai-usage-tui --version`.
      placeholder: ai-usage-tui 0.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 x86_64 / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics (optional)
      description: |
        `AI_USAGE_LOG=/tmp/ai-usage.log ai-usage-tui` records collector errors — the dashboard
        holds the alternate screen, so stderr is invisible while it runs. Review the file before
        pasting; it contains file paths.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included credentials, prompts, completions, or raw session data.
          required: true
