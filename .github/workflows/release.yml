name: Release

on:
  push:
    tags:
      - v*
  # The release path only ever ran on a real tag, which meant its first execution was also
  # its first test — with a published release riding on the outcome. A dispatch run exercises
  # every build, package, and verification step and skips only the publish.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to simulate. Nothing is published on a dispatch run."
        default: v0.0.0-dryrun
        type: string
      # Off by default: an attestation is a public, permanent record in a transparency log, and a
      # dry run's artifacts are not a release. On when the attestation steps themselves are what
      # is being tried -- a step first exercised by a real tag is the thing dry runs exist to avoid.
      attest:
        description: "Also attest the dry-run artifacts (public and permanent; for testing the attestation steps)."
        default: false
        type: boolean

# Read-only unless a job says otherwise. This was `contents: write` for every job, so the five
# build jobs and the crates.io job each held a token that could rewrite the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: x86_64-linux
            arch: x86-64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: aarch64-linux
            arch: aarch64
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          # Static builds, for where the gnu ones do not start: Alpine and every container built
          # on it (musl, no glibc at all), and distributions whose glibc is older than this
          # runner's. One file, nothing to resolve at load time. SQLite is compiled in already
          # and TLS is rustls, so nothing else has to be found for musl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            slug: x86_64-linux-musl
            arch: x86-64
            apt: musl-tools
            static: true
            strip: true
          # No musl cross toolchain for aarch64 is packaged for the runner, so zig is the C
          # compiler and linker: cargo-zigbuild drives it, and the version is pinned below.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            slug: aarch64-linux-musl
            arch: aarch64
            static: true
            zig: true
          # macos-latest is Apple Silicon. Building without --target here and labelling the
          # result x86_64 shipped an arm64 binary to Intel users; each arch now builds on a
          # runner of its own architecture and is verified below.
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: aarch64-macos
            arch: arm64
          # Cross-compiled from the Apple Silicon runner rather than built on `macos-13`.
          # That Intel image is being retired: a dry run sat queued on it for 76 minutes
          # without ever starting, which on a real tag push would hang the release.
          # Xcode ships both SDKs, so an explicit `--target` produces a genuine x86_64
          # binary — and the `file` assertion below is what makes that claim checkable.
          # The original bug was the *absence* of `--target`, not cross-compilation.
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: x86_64-macos
            arch: x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            slug: x86_64-windows
    env:
      ARTIFACT: ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          # Only where there is one to name: x86_64 musl links with the toolchain's own linker
          # and needs the package for `musl-gcc`, which compiles SQLite and ring.
          if [ -n "${{ matrix.linker }}" ]; then
            echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          fi

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-zigbuild

      # zig from PyPI, pinned: the same compiler on every run, from an index the runner already
      # trusts for its own tooling. cargo-zigbuild finds it as `python3 -m ziglang`.
      - name: Install zig
        if: matrix.zig
        run: python3 -m pip install --user --break-system-packages ziglang==0.13.0

      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # The whole point of the rewrite: prove the binary is the architecture we are about to
      # put that architecture's name on.
      - name: Verify architecture
        if: runner.os != 'Windows' && matrix.arch != ''
        run: |
          BIN="target/${{ matrix.target }}/release/ai-usage-tui"
          file "$BIN"
          file "$BIN" | grep -q -- "${{ matrix.arch }}" \
            || { echo "::error::$BIN is not ${{ matrix.arch }}"; exit 1; }

      # "Static" is a claim about the file, so it is checked on the file -- and then the x86_64
      # one is run where a gnu build cannot start at all: a bare Alpine, with no glibc in it.
      - name: Verify it is static
        if: matrix.static
        run: |
          BIN="target/${{ matrix.target }}/release/ai-usage-tui"
          file "$BIN" | grep -Eq 'static(ally|-pie) linked' \
            || { echo "::error::$BIN is not statically linked"; exit 1; }
          if [ "${{ matrix.arch }}" = "x86-64" ]; then
            docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/w:ro" alpine:3.22 \
              /w/ai-usage-tui --version
            docker run --rm -v "$PWD:/src:ro" alpine:3.22 \
              /src/target/${{ matrix.target }}/release/ai-usage-tui --json --all \
                --db /src/tests/fixtures/opencode_test.db --claude-dir /nonexistent \
                --codex-dir /nonexistent --copilot-dir /nonexistent --gemini-dir /nonexistent \
                --omarchy-dir /nonexistent --journal /nonexistent/journal.db \
              | grep -q '"usage"' \
              || { echo "::error::the static build did not read the fixture database on Alpine"; exit 1; }
          fi

      - name: Strip
        if: runner.os != 'Windows' && (matrix.apt == '' || matrix.strip) && !matrix.zig
        run: strip "target/${{ matrix.target }}/release/ai-usage-tui"

      # release-process.md requires the binary, README and LICENSE in every artifact, and the
      # MIT terms ask that the licence accompany copies. Through v0.4.0 the archives held the
      # binary alone -- the .deb and .rpm were the only artifacts getting this right.
      # Generated from a *host* build, not the cross-compiled one: a man page and completion
      # scripts are architecture-independent, and an aarch64 binary cannot be executed on the
      # x86_64 runner that produced it.
      - name: Generate man page and completions
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p dist/completions
          ./target/release/ai-usage-tui --man > dist/ai-usage-tui.1
          for sh in bash zsh fish powershell; do
            case "$sh" in
              bash) out=dist/completions/ai-usage-tui.bash ;;
              zsh)  out=dist/completions/_ai-usage-tui ;;
              fish) out=dist/completions/ai-usage-tui.fish ;;
              powershell) out=dist/completions/_ai-usage-tui.ps1 ;;
            esac
            ./target/release/ai-usage-tui --completions "$sh" > "$out"
            test -s "$out" || { echo "::error::$out is empty"; exit 1; }
          done

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/ai-usage-tui" README.md LICENSE "$STAGE/"
          cp -r dist/ai-usage-tui.1 dist/completions "$STAGE/"
          tar czf "$ARTIFACT.tar.gz" -C "$STAGE" ai-usage-tui README.md LICENSE ai-usage-tui.1 completions

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "./target/${{ matrix.target }}/release/ai-usage-tui.exe" stage/
          Copy-Item README.md, LICENSE stage/
          # The zip held the binary and two text files: PowerShell completions were never
          # generated by anything, and Windows was the one platform whose archive had none. The
          # exe is native to this runner, so it writes its own. Only PowerShell's: written from
          # here a bash script would get CRLF line endings, and bash reads `\r` as part of a word.
          # `Out-File -Encoding utf8`, not `>`: Windows PowerShell 5 would write UTF-16.
          New-Item -ItemType Directory -Force -Path stage/completions | Out-Null
          $exe = "./target/${{ matrix.target }}/release/ai-usage-tui.exe"
          & $exe --completions powershell | Out-File -Encoding utf8 stage/completions/_ai-usage-tui.ps1
          foreach ($file in Get-ChildItem stage/completions) {
            if ($file.Length -eq 0) { Write-Error "$($file.Name) is empty"; exit 1 }
          }
          7z a "$env:ARTIFACT.zip" "./stage/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.tar.gz
            ${{ env.ARTIFACT }}.zip
          if-no-files-found: error

  # `[package.metadata.deb]` and `[package.metadata.generate-rpm]` shipped in Cargo.toml and
  # the CHANGELOG advertised .deb/.rpm packages, but no job ever built them. Either the jobs
  # exist or the claim goes; these are the jobs.
  linux-packages:
    name: Linux packages (${{ matrix.slug }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The static builds, not the gnu ones. A gnu binary needs the glibc of the runner that
        # linked it, and through v0.20.0 that was 2.39: the .deb said so (`Depends: libc6 (>=
        # 2.39)`), so apt refused it on Debian 12 and Ubuntu 22.04, and the .rpm said nothing, so
        # it installed on RHEL 9 and the binary would not start. A package exists to run on the
        # distribution it is installed on, whichever release that is.
        include:
          - target: x86_64-unknown-linux-musl
            slug: amd64
            apt: musl-tools
          - target: aarch64-unknown-linux-musl
            slug: arm64
            zig: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pkg-${{ matrix.target }}

      - name: Install musl tools
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-zigbuild

      - name: Install zig
        if: matrix.zig
        run: python3 -m pip install --user --break-system-packages ziglang==0.13.0

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # `[package.metadata.deb] assets` lists dist/, and cargo-deb fails on a missing asset --
      # deliberately, so a package cannot quietly lose its completions. Generated from a host
      # build for the same reason as above.
      - name: Generate man page and completions
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p dist/completions
          ./target/release/ai-usage-tui --man > dist/ai-usage-tui.1
          ./target/release/ai-usage-tui --completions bash > dist/completions/ai-usage-tui.bash
          ./target/release/ai-usage-tui --completions zsh  > dist/completions/_ai-usage-tui
          ./target/release/ai-usage-tui --completions fish > dist/completions/ai-usage-tui.fish

      - name: Build .deb
        run: cargo deb --no-build --target ${{ matrix.target }} --output "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.deb"

      - name: Build .rpm
        run: cargo generate-rpm --target ${{ matrix.target }} --output "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.rpm"

      # A package that installs nothing useful is worse than no package. Prove the payload is
      # present and executable before publishing it.
      - name: Verify package contents
        run: |
          dpkg-deb -c "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.deb" | tee /tmp/deb.txt
          grep -q "usr/bin/ai-usage-tui" /tmp/deb.txt \
            || { echo "::error::.deb does not contain the binary"; exit 1; }
          rpm -qlp "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.rpm" | tee /tmp/rpm.txt
          grep -q "/usr/bin/ai-usage-tui" /tmp/rpm.txt \
            || { echo "::error::.rpm does not contain the binary"; exit 1; }
          for path in "usr/share/man/man1/ai-usage-tui.1" "bash-completion/completions/ai-usage-tui"; do
            grep -q "$path" /tmp/deb.txt || { echo "::error::.deb is missing $path"; exit 1; }
            grep -q "$path" /tmp/rpm.txt || { echo "::error::.rpm is missing $path"; exit 1; }
          done
          # Static, so neither package may ask for a C library -- that requirement is what made
          # the last ones uninstallable on a current stable distribution.
          # The Depends field alone: the description is the README, which discusses glibc.
          dpkg-deb -f "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.deb" Depends | tee /tmp/depends.txt
          if grep -qi 'libc' /tmp/depends.txt; then
            echo "::error::.deb depends on a C library; the binary in it is not static"; exit 1
          fi
          if rpm -qpR "ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.rpm" | grep -qi 'libc\.so'; then
            echo "::error::.rpm requires libc.so; the binary in it is not static"; exit 1
          fi

      # The claim, tried: installed by the distribution's own package manager on the oldest
      # releases a user is likely to have, and run there. amd64 only -- the runner is.
      - name: Install and run on old distributions
        if: matrix.slug == 'amd64'
        run: |
          set -euo pipefail
          DEB="ai-usage-tui-${{ inputs.tag || github.ref_name }}-amd64.deb"
          RPM="ai-usage-tui-${{ inputs.tag || github.ref_name }}-amd64.rpm"
          for image in debian:11 ubuntu:20.04; do
            docker run --rm -v "$PWD:/w:ro" "$image" sh -c "dpkg -i /w/$DEB && ai-usage-tui --version"
          done
          for image in rockylinux:8 fedora:latest; do
            docker run --rm -v "$PWD:/w:ro" "$image" sh -c "rpm -i /w/$RPM && ai-usage-tui --version"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}-linux-packages
          path: |
            ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.deb
            ai-usage-tui-${{ inputs.tag || github.ref_name }}-${{ matrix.slug }}.rpm
          if-no-files-found: error

  release:
    name: Release
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the signing identity an attestation is issued to
      attestations: write # store the attestations against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Hashed by basename, not by the path inside the download directory. `sha256sum */*`
      # recorded `<artifact-dir>/<file>`, but the release assets are published flat, so
      # `sha256sum -c checksums.txt` failed on every line with "No such file or directory" --
      # the hashes were right and the file was unusable. Verified through v0.4.0.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          find . -mindepth 2 -type f -print0 | sort -z |
            while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done > checksums.txt
          cat checksums.txt
          # Names must be bare filenames; a slash means the prefix crept back in.
          if grep -q '/' checksums.txt; then
            echo "::error::checksums.txt contains path components; it will not verify against the published assets"
            exit 1
          fi

      # What every released binary is built from: each crate in Cargo.lock that any target links,
      # with its version, licence and registry checksum, as CycloneDX. `--target all` because one
      # document describes five targets, and a Windows-only crate is still something shipped.
      # Dev-dependencies are left out by the tool: they are not in the binary.
      #
      # The generator is a pinned release, fetched from its own repository and checked against a
      # digest written here -- not the `.sha256` served beside it, which whoever could replace
      # the archive could replace too.
      - name: Generate the bill of materials
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o cargo-cyclonedx.tar.xz \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CYCLONEDX_VERSION}/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          echo "${CYCLONEDX_SHA256}  cargo-cyclonedx.tar.xz" | sha256sum -c -
          tar -xJf cargo-cyclonedx.tar.xz
          export PATH="$PWD/cargo-cyclonedx-x86_64-unknown-linux-gnu:$PATH"
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --override-filename "ai-usage-tui-${RELEASE_TAG}.cdx"
          mkdir -p sbom
          mv "ai-usage-tui-${RELEASE_TAG}.cdx.json" sbom/
          # It must describe this crate at this version, and list what the lockfile lists.
          jq -e --arg version "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" '
            .bomFormat == "CycloneDX"
            and .metadata.component.name == "ai-usage-tui"
            and .metadata.component.version == $version
            and (.components | length) > 100
            and ([.components[] | select(.hashes == null)] | length) == 0
          ' "sbom/ai-usage-tui-${RELEASE_TAG}.cdx.json" >/dev/null \
            || { echo "::error::the generated bill of materials does not describe this release"; exit 1; }
          echo "bill of materials: $(jq '.components | length' "sbom/ai-usage-tui-${RELEASE_TAG}.cdx.json") components"
        env:
          CYCLONEDX_VERSION: 0.5.9
          CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      # Package manifests referenced ai-usage-tui-0.2.0-... while the workflow publishes
      # ai-usage-tui-v0.2.0-... , so every template URL 404'd. Render them from the real
      # artifact names and real checksums instead of hand-maintaining both.
      - name: Render packaging manifests
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"

          if [ ! -f artifacts/checksums.txt ]; then
            echo "::error::artifacts/checksums.txt is missing; the checksum step did not run"
            exit 1
          fi
          echo "--- checksums.txt ---"
          cat artifacts/checksums.txt

          # Matched with awk on the path's final component rather than a regex, so a filename
          # containing regex metacharacters (every one of ours contains dots) cannot silently
          # match the wrong line or none at all.
          sha_for() {
            local name="$1" sha
            sha="$(awk -v n="$name" 'index($2, n) && substr($2, length($2) - length(n) + 1) == n { print $1 }' artifacts/checksums.txt)"
            if [ -z "$sha" ]; then
              echo "::error::no checksum found for $name — the build job that produces it did not upload an artifact" >&2
              return 1
            fi
            printf '%s' "$sha"
          }

          LINUX_SHA="$(sha_for "ai-usage-tui-${TAG}-x86_64-linux.tar.gz")"
          LINUX_ARM_SHA="$(sha_for "ai-usage-tui-${TAG}-aarch64-linux.tar.gz")"
          LINUX_MUSL_SHA="$(sha_for "ai-usage-tui-${TAG}-x86_64-linux-musl.tar.gz")"
          LINUX_ARM_MUSL_SHA="$(sha_for "ai-usage-tui-${TAG}-aarch64-linux-musl.tar.gz")"
          MACOS_ARM_SHA="$(sha_for "ai-usage-tui-${TAG}-aarch64-macos.tar.gz")"
          MACOS_X86_SHA="$(sha_for "ai-usage-tui-${TAG}-x86_64-macos.tar.gz")"
          WINDOWS_SHA="$(sha_for "ai-usage-tui-${TAG}-x86_64-windows.zip")"
          echo "--- resolved checksums ---"
          echo "linux      $LINUX_SHA"
          echo "linux arm  $LINUX_ARM_SHA"
          echo "linux musl $LINUX_MUSL_SHA"
          echo "linux arm musl $LINUX_ARM_MUSL_SHA"
          echo "macos arm  $MACOS_ARM_SHA"
          echo "macos x86  $MACOS_X86_SHA"
          echo "windows    $WINDOWS_SHA"

          # The one description and the one topic list, from the manifest crates.io publishes.
          # These used to be hand-copied into each template, which is how the .rb, the .json, the
          # .nuspec, Cargo.toml, src/cli.rs and the README ended up carrying five wordings.
          DESCRIPTION="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["description"])')"
          TOPICS="$(python3 -c 'import tomllib;print(" ".join(tomllib.load(open("Cargo.toml","rb"))["package"]["metadata"]["identity"]["topics"]))')"
          # The project's front door, from the same manifest. Every template named the GitHub
          # repository as its homepage, so `brew info`, `scoop info`, the Chocolatey gallery and
          # `pacman -Si` all sent a reader to the source tree while crates.io and GitHub's About
          # box sent them to the site. One field now, rendered everywhere.
          HOMEPAGE="$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["homepage"])')"
          [ -n "$DESCRIPTION" ] || { echo "::error::Cargo.toml has no package.description"; exit 1; }
          [ -n "$HOMEPAGE" ] || { echo "::error::Cargo.toml has no package.homepage"; exit 1; }
          [ -n "$TOPICS" ] || { echo "::error::Cargo.toml has no package.metadata.identity.topics"; exit 1; }

          # The one-line form, for `pkgdesc`. `man PKGBUILD`: "Try to keep the description to one
          # line of text and to not use the package's name" -- and the full description is 300-odd
          # characters, which would be three lines in `pacman -Si` and in every AUR search result.
          # The rule is "the clause before the em dash", expressed here as one parameter expansion
          # and asserted in tests/docs.rs, so this stays a derivation of the single source of truth
          # rather than becoming a sixth hand-written wording. If the description ever loses its em
          # dash this falls back to the whole string, which the length guard below then catches.
          DESCRIPTION_SHORT="${DESCRIPTION%% — *}"
          [ "${#DESCRIPTION_SHORT}" -le 100 ] \
            || { echo "::error::the pkgdesc derived from package.description is ${#DESCRIPTION_SHORT} characters; man PKGBUILD asks for one line"; exit 1; }

          echo "--- identity ---"
          echo "description  $DESCRIPTION"
          echo "homepage     $HOMEPAGE"
          echo "pkgdesc      $DESCRIPTION_SHORT"
          echo "topics       $TOPICS"

          # Rendered under `rendered/` preserving each template's path below `packaging/`, so the
          # Chocolatey pair keeps its layout. Flattening with `basename` put chocolateyinstall.ps1
          # beside the nuspec, whose `<file src="tools/**" target="tools/">` then matched nothing:
          # `choco pack` on the published files produced a package that installed nothing at all.
          mkdir -p rendered
          for f in packaging/homebrew/ai-usage-tui.rb \
                   packaging/scoop/ai-usage-tui.json \
                   packaging/chocolatey/ai-usage-tui.nuspec \
                   packaging/chocolatey/tools/chocolateyinstall.ps1 \
                   packaging/aur/PKGBUILD; do
            if [ ! -f "$f" ]; then
              echo "::error::packaging template $f is missing from the checkout"
              exit 1
            fi
            out="rendered/${f#packaging/}"
            mkdir -p "$(dirname "$out")"
            # __DESCRIPTION_SHORT__ is substituted *before* __DESCRIPTION__. The two tokens
            # cannot actually collide -- "__DESCRIPTION__" is not a substring of
            # "__DESCRIPTION_SHORT__", because the underscore pair is broken by `_SHORT` -- but
            # the ordering costs nothing and does not depend on anyone re-deriving that.
            sed -e "s|__TAG__|${TAG}|g" \
                -e "s|__DESCRIPTION_SHORT__|${DESCRIPTION_SHORT}|g" \
                -e "s|__DESCRIPTION__|${DESCRIPTION}|g" \
                -e "s|__TOPICS__|${TOPICS}|g" \
                -e "s|__HOMEPAGE__|${HOMEPAGE}|g" \
                -e "s|__VERSION__|${VERSION}|g" \
                -e "s|__LINUX_SHA256__|${LINUX_SHA}|g" \
                -e "s|__LINUX_ARM_SHA256__|${LINUX_ARM_SHA}|g" \
                -e "s|__LINUX_MUSL_SHA256__|${LINUX_MUSL_SHA}|g" \
                -e "s|__LINUX_ARM_MUSL_SHA256__|${LINUX_ARM_MUSL_SHA}|g" \
                -e "s|__MACOS_ARM_SHA256__|${MACOS_ARM_SHA}|g" \
                -e "s|__MACOS_X86_SHA256__|${MACOS_X86_SHA}|g" \
                -e "s|__WINDOWS_SHA256__|${WINDOWS_SHA}|g" \
                "$f" > "$out"
            echo "rendered $out"
          done

          # The nuspec's own glob is the thing that broke; assert the layout it needs.
          test -f rendered/chocolatey/ai-usage-tui.nuspec \
            && test -f rendered/chocolatey/tools/chocolateyinstall.ps1 \
            || { echo "::error::chocolatey render layout is wrong; the nuspec's tools/** glob will match nothing"; exit 1; }

          # A PKGBUILD's checksums are the only thing standing between an AUR user and an
          # unverified download, and an empty substitution renders as `sha256sums_x86_64=('')`,
          # which the placeholder grep below cannot see -- it looks for tokens that are still
          # there, not for values that went missing. makepkg treats an empty array entry as a
          # hard failure rather than skipping verification, so this is defence in depth, but the
          # failure belongs here where it names itself rather than in a user's build.
          aur_sums="$(grep -cE "^sha256sums_(x86_64|aarch64)=\('[0-9a-f]{64}'\)$" rendered/aur/PKGBUILD || true)"
          [ "$aur_sums" = "2" ] \
            || { echo "::error::rendered/aur/PKGBUILD has $aur_sums of 2 valid sha256 lines"; exit 1; }

          # Written as an explicit if rather than `! grep ... || { ... }`: the negation form
          # made a failure anywhere in this step exit with no output at all, which is how the
          # first dry run failed in 9ms with nothing to go on.
          # Any __UPPER_SNAKE__ token, not a hand-maintained list of them. __DESCRIPTION__ and
          # __TOPICS__ were added after this check was written, and a named list is exactly the
          # thing that gets forgotten -- which is the same failure this whole change is about.
          if grep -rnE "PLACEHOLDER|__[A-Z][A-Z0-9_]*__" rendered/; then
            echo "::error::unrendered placeholder left in packaging manifest (shown above)"
            exit 1
          fi
          echo "all manifests rendered with no placeholders remaining"
        env:
          # Deliberately not GITHUB_REF_NAME: variables starting with GITHUB_ are
          # reserved, so a step-level override of one is displayed in the log but
          # silently ignored — the runner's own value wins.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, ver)) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > body.txt
        env:
          # Deliberately not GITHUB_REF_NAME: variables starting with GITHUB_ are
          # reserved, so a step-level override of one is displayed in the log but
          # silently ignored — the runner's own value wins.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      # The asset list the publish step will upload, checked before anything is made public: every
      # file present and non-empty, no two with one name, every archive vouched for by
      # checksums.txt. On every run, and ahead of the attestations on purpose -- this ran only on a
      # dry run, so on a real tag the same check first happened inside the publish step, *after*
      # the attestations were already permanent, for a release that would then never exist.
      - name: Check the release assets
        run: scripts/publish-release.sh --plan "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      # A checksum says a download is the file the release lists. An attestation says where that
      # file came from: signed by this workflow's identity, it binds each archive and package to
      # this repository, this workflow and the commit it ran at, and anyone can check it with
      # `gh attestation verify <file> --repo SophanaSok/ai-usage-tui`. One attestation covers
      # everything checksums.txt names. Before the publish step on purpose: if this fails, the
      # release has not been created and nothing downstream has run.
      - name: Attest where the archives and packages were built
        if: github.event_name == 'push' || inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/checksums.txt

      - name: Attest what they are built from
        if: github.event_name == 'push' || inputs.attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: artifacts/checksums.txt
          sbom-path: sbom/ai-usage-tui-${{ inputs.tag || github.ref_name }}.cdx.json

      - name: Dry run — nothing is published
        if: github.event_name != 'push'
        run: |
          echo "::notice::Dry run complete. Artifacts, packages, checksums, the bill of materials and"
          echo "::notice::the rendered manifests were all built and verified; nothing was published."

      # One upload at a time, each confirmed against the API, the release a draft until all are.
      # This was `softprops/action-gh-release`, which uploads everything at once; on v0.17.0 GitHub
      # left the large assets stuck half-finished and re-runs made it worse. The reasons and the
      # recovery are in the script's header.
      - name: Publish the release, one asset at a time
        if: github.event_name == 'push'
        run: scripts/publish-release.sh --publish "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Upload rendered manifests for the tap job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-manifests
          path: rendered/
          if-no-files-found: error

  # Publishing to crates.io is what makes `cargo install ai-usage-tui` and `cargo binstall`
  # work. Gated on the secret so the job is inert until the name is claimed and the token is
  # added -- it can never turn a dry run red, and it never runs on workflow_dispatch.
  publish-crate:
    name: Publish to crates.io
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Skip when no registry token is configured
        id: gate
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish."
            echo "::notice::See docs/release-process.md, 'First publish', for the one-time setup."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The tag and the manifest must agree, or the release page and the registry would carry
      # different versions under the same name.
      - name: Verify the tag matches Cargo.toml
        if: steps.gate.outputs.run == 'true'
        run: |
          MANIFEST="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "v$MANIFEST" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $MANIFEST"
            exit 1
          fi

      - name: Publish
        if: steps.gate.outputs.run == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # `brew install sophanasok/tap/ai-usage-tui` and `scoop install ai-usage-tui` only work if the
  # rendered manifests land in a tap and a bucket. Skips with a notice only when TAP_TOKEN is
  # unset. Everything else -- a token that has expired, a push that did not land, a manifest
  # that does not name this tag when read back -- fails the job: a green check here has to mean
  # that what a user installs from each channel is this release.
  update-taps:
    name: Update tap and bucket
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nothing of this repository's: it pushes to two others, with a token of its own.
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered-manifests
          path: rendered

      - name: Push to the Homebrew tap and Scoop bucket
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::TAP_TOKEN is not set; skipping the tap and bucket update."
            echo "::notice::See docs/release-process.md, 'First publish', for the one-time setup."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${TAG#v}"

          push_one() {
            repo="$1" src="$2" dest="$3"
            # An error, not the warning-and-skip this used to be. Both repositories exist, so a
            # clone that fails is a token that has expired or lost access -- and a token that
            # expires quietly is the one failure this job must never turn green on: the release
            # would succeed while `brew upgrade` and `scoop update` went on serving the previous
            # version indefinitely, with nothing anywhere saying so.
            if ! git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${repo}.git" work; then
              echo "::error::${repo} could not be cloned: TAP_TOKEN has expired or lost access to it."
              exit 1
            fi
            mkdir -p "work/$(dirname "$dest")"
            cp "$src" "work/$dest"
            ( cd work
              git add "$dest"
              if git diff --cached --quiet; then
                echo "::notice::${repo}/${dest} is already current."
              else
                git commit -m "ai-usage-tui ${TAG}"
                git push
                echo "::notice::pushed ${repo}/${dest}"
              fi )
            rm -rf work
          }

          verify_one() {
            repo="$1" dest="$2"
            # Read back through the API rather than raw.githubusercontent.com: the raw CDN caches
            # for minutes, and reading the previous version back would fail a push that landed.
            if ! content="$(curl -fsS \
                -H "Authorization: Bearer ${TAP_TOKEN}" \
                -H "Accept: application/vnd.github.raw+json" \
                "https://api.github.com/repos/${repo}/contents/${dest}")"; then
              echo "::error::${repo}/${dest} could not be read back after the push."
              exit 1
            fi
            if ! grep -Fq "${version}" <<<"${content}"; then
              echo "::error::${repo}/${dest} does not name ${version} after the push; that channel is stale."
              exit 1
            fi
            echo "::notice::${repo}/${dest} names ${version}."
          }

          push_one "SophanaSok/homebrew-tap" "rendered/homebrew/ai-usage-tui.rb"  "Formula/ai-usage-tui.rb"
          push_one "SophanaSok/scoop-bucket" "rendered/scoop/ai-usage-tui.json"   "bucket/ai-usage-tui.json"

          # What makes this job's green mean something: the manifest a user will install from
          # each channel, as it is now, names this release.
          verify_one "SophanaSok/homebrew-tap" "Formula/ai-usage-tui.rb"
          verify_one "SophanaSok/scoop-bucket" "bucket/ai-usage-tui.json"

  # The Chocolatey manifests have been rendered and attached to every release and never once
  # packed, let alone pushed -- and the one time `choco pack` was run on them by hand it built a
  # package that installed nothing. So the pack runs here on every run, dry runs included, and
  # its payload is checked. The push is gated on a key, as crates.io's is: until an account
  # exists and `CHOCOLATEY_API_KEY` is set, this job proves the package and publishes nothing.
  chocolatey:
    name: Chocolatey package
    needs: [release]
    runs-on: windows-latest
    # Nothing of this repository's: it reads an artifact and pushes to another service.
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered-manifests
          path: rendered

      - name: Pack
        run: |
          choco pack rendered/chocolatey/ai-usage-tui.nuspec --outputdirectory .
          $package = Get-ChildItem ai-usage-tui.*.nupkg | Select-Object -First 1
          if (-not $package) { Write-Error "choco pack produced no .nupkg"; exit 1 }
          # A .nupkg is a zip. The install script is the whole payload: without it the package
          # installs, reports success and puts nothing on PATH.
          $listing = 7z l $package.FullName
          $listing
          if (-not ($listing -match 'tools[\\/]chocolateyinstall\.ps1')) {
            Write-Error "$($package.Name) does not contain tools/chocolateyinstall.ps1"
            exit 1
          }

      - name: Push, when a key is configured
        if: github.event_name == 'push'
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Output "::notice::CHOCOLATEY_API_KEY is not set; the package was built and checked, and not pushed."
            exit 0
          }
          $package = Get-ChildItem ai-usage-tui.*.nupkg | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { Write-Error "choco push failed"; exit 1 }
