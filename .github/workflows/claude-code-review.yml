name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write, not read: posting a review comment is a write on the pull request,
      # and the generated workflow shipped with `read`. The job ran, spent its turns
      # and reported success -- with `permission_denials_count: 1` and "No buffered
      # inline comments", so a review that found something had no way to say so.
      # Safe on a public repository: GitHub downgrades the token to read-only for
      # pull_request runs from forks regardless of what is asked for here, so this
      # grants nothing to fork-controlled code.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The review reads git history for context, so it needs more than the tip.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        env:
          GH_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMPORARY, for the verification runs only -- removed before merge. This
          # repository and its action logs are public.
          show_full_output: true
          # This prompt reviews in-process on purpose; see the note below the prompt.
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in the repository
            ${{ github.repository }}, and post the result as a single comment on it.

            Do the whole review yourself, in this session. Do NOT spawn subagents, launch
            background tasks, or use the Task tool: this runs as a single non-interactive
            invocation, so a backgrounded agent's result never comes back and the review is
            lost. If you find yourself about to wait for something, do the work instead.

            Steps:

            1. Read the change with `gh pr diff` and `gh pr view`. Skip the review entirely --
               post nothing and stop -- if the pull request is closed, is a draft, or already
               carries a code review comment from you.
            2. Read the root CLAUDE.md and any CLAUDE.md in the directories the diff touches,
               if they exist. They are guidance for writing code, so not every instruction
               applies to a review.
            3. Review the diff for: bugs and logic errors; CLAUDE.md violations; anything the
               git history of these lines (`git log`, `git blame`) shows was already tried and
               reverted; and guidance in code comments in the modified files that the change
               contradicts. Focus on real defects over nitpicks.
            4. For each candidate issue, argue the other side before keeping it. Keep only the
               issues you are confident are real and would be hit in practice.

            Do not flag, and do not report:

            - pre-existing issues, or real issues on lines the pull request did not modify
            - anything a linter, typechecker or compiler catches (imports, types, formatting):
              CI runs those separately. Do not build, typecheck or run the tests yourself.
            - general test-coverage, documentation or security observations, unless a relevant
              CLAUDE.md requires them
            - issues silenced deliberately in the code (a lint-ignore comment, an explanatory
              comment saying why)
            - changes in behaviour that are plainly the point of the pull request

            Then post exactly one comment with `gh pr comment`, in this format, with no emojis:

            ### Code review

            Found N issues:

            1. <brief description> (<why it was flagged -- quote the CLAUDE.md line, or name the
               file and code it contradicts>)

            <permalink to the lines, using the full commit sha: https://github.com/OWNER/REPO/blob/FULLSHA/path/to/file#L10-L15>

            ...and if you found nothing worth reporting, post this instead of staying silent:

            ### Code review

            No issues found. Checked for bugs and CLAUDE.md compliance.

            Post the "no issues" comment rather than nothing. Silence is how a review that never
            ran looks, and telling the two apart cost this repository eight runs once already.

            Permalinks need the full sha -- run `git rev-parse HEAD` and paste the value; a
            command substitution inside the URL will not render. Give a line of context either
            side of the line you mean.
          # Reviewed in-process, not through `/code-review:code-review`. That plugin's command
          # fans out to a Haiku eligibility agent, five parallel Sonnet reviewers and a Haiku
          # scorer per issue -- and this action launches those as *background tasks*. The parent
          # ends its turn waiting for a completion notification that a `-p` run never delivers:
          # run 33568706427 finished `"num_turns": 6`, `"permission_denials": []`, on
          # `"result": "I'll wait for the background agent's completion notification before
          # continuing."` More turn budget does not help, because nothing hit a cap.
          #
          # The same run showed the posting path was wrong too: that plugin posts one summary
          # comment with `gh pr comment` and never creates inline comments, so the generated
          # workflow's `mcp__github_inline_comment__create_inline_comment` and the action's
          # buffered-comment step were always going to find an empty queue.
          #
          # `--allowedTools` REPLACES the default allowlist rather than extending it. That is
          # what denied the `Skill` tool when the prompt was a slash command (six turns, one
          # denial, a review that never started, and a green check). Anything this prompt needs
          # has to be named here.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git rev-parse:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
