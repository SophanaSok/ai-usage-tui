name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write, not read: posting an inline review comment is a write on the pull
      # request, and the generated workflow shipped with `read`. The job ran, spent
      # its turns and reported success -- with `permission_denials_count: 1` and
      # "No buffered inline comments", so a review that found something had no way
      # to say so. Safe on a public repository: GitHub downgrades the token to
      # read-only for pull_request runs from forks regardless of what is asked for
      # here, so this grants nothing to fork-controlled code.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # `Skill` first, and it is not optional: the `prompt:` above is `/code-review:code-review`,
          # which the model invokes through the `Skill` tool. `--allowedTools` replaces the
          # default allowlist rather than extending it, so the generated workflow -- which named
          # the inline-comment tool alone -- denied the review skill on its very first move and
          # then reported success. Four runs on a pull request carrying two deliberate defects:
          #
          #   comment tool only            6 turns,  1 denial (Skill),  never reviewed
          #   flag removed, defaults        21 turns, 7 denials,         reviewed, could not post
          #   + Read/Grep/Glob/Bash         7 turns,  1 denial (Skill),  never reviewed
          #
          # `show_full_output` named the denial as
          # `{"tool_name":"Skill","tool_input":{"skill":"code-review:code-review"}}`, which is the
          # only reason this is a fix rather than a fourth guess.
          claude_args: '--allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash"'
          # TEMPORARY — remove once the denied tool is named. Three configurations have now
          # ended "No buffered inline comments" with a nonzero `permission_denials_count`, and
          # the job log never says which tool was refused, so every further change is a guess.
          # This prints every Claude message, tool call and tool result.
          #
          # This repository is public and these logs are public with it. Nothing here reads a
          # credential — the checkout has no user data, and the collectors' inputs do not exist
          # on the runner — but it stays on only as long as the one diagnostic run needs it.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

