name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write, not read: posting an inline review comment is a write on the pull
      # request, and the generated workflow shipped with `read`. The job ran, spent
      # its turns and reported success -- with `permission_denials_count: 1` and
      # "No buffered inline comments", so a review that found something had no way
      # to say so. Safe on a public repository: GitHub downgrades the token to
      # read-only for pull_request runs from forks regardless of what is asked for
      # here, so this grants nothing to fork-controlled code.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # No `claude_args: --allowedTools ...` here. The generated workflow named the
          # inline-comment tool alone, and every run then reported success with
          # `permission_denials_count: 1` and "No buffered inline comments" -- including on a
          # pull request carrying two deliberate, unmissable defects. The suspicion is that the
          # flag restricts the tool set rather than extending it, leaving the reviewer no Read,
          # Grep or Bash to review with. See docs/roadmap.md.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

