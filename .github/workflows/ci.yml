name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory against a dependency that has not changed produces no push and no PR, so a
  # push-only trigger never notices it. Weekly, the advisory job runs anyway.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here reads the repository and nothing else. The repository default is already
# read-only; written down, it survives that setting being changed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    # Path resolution, timezone handling and the SQLite readers are all platform-sensitive,
    # and Windows in particular was broken for the entire life of the project because nothing
    # here ever compiled it.
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked

      - name: Smoke test the CLI against the fixture database
        shell: bash
        run: |
          cargo build --release --locked
          BIN=target/release/ai-usage-tui
          [ -f "$BIN" ] || BIN=target/release/ai-usage-tui.exe
          "$BIN" --version
          # Exercises path resolution end to end: this is the check that would have caught
          # "HOME is not set" on Windows.
          "$BIN" --json --db tests/fixtures/opencode_test.db --all > out.json
          head -c 400 out.json
          grep -q '"usage"' out.json
          # A reader that closes the pipe is a normal end to a pipeline, not a crash. This
          # used to abort with "failed printing to stdout: Broken pipe".
          "$BIN" --json --db tests/fixtures/opencode_test.db --all | head -c 200 > /dev/null
          "$BIN" --json --db tests/fixtures/opencode_test.db --all | grep -q '"usage"' 

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  # A doc-only PR can break `cargo doc` (a bad intra-doc link) or a relative link between the
  # README and docs/. Both are cheap to check and neither was checked; the Omarchy split moved a
  # section between files and left two dangling anchors behind.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Relative links in Markdown resolve
        # The checker lives in scripts/ so that `just docs` and this job run the same code. It
        # used to be a 20-line Python heredoc here, which `just check` did not run at all.
        run: python3 scripts/check-markdown-links.py .

      - name: Release scripts
        # The release job's publish step is a shell script, and a tag push is its only real run.
        # This is where it is tested -- against a fake `gh` and `curl` -- before a release needs it.
        run: |
          shellcheck scripts/*.sh
          scripts/test-publish-release.sh

  # Reported, never gated. A threshold turns coverage into something to be satisfied, and the
  # cheapest way to satisfy one is a test that runs a line without checking it -- the opposite of
  # the rule here that a test must fail against its bug. What the table is for is reading: a
  # module near zero is a module nothing exercises, which is how the Zen catalogue fetch was found
  # still writing through a shared temporary after that had been fixed everywhere else.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-17
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      # Prebuilt, for the reason cargo-deny is: a from-source install costs minutes per run.
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov
      - name: Line coverage by file
        run: |
          cargo llvm-cov --all-targets --locked --summary-only | tee coverage.txt
          {
            echo '### Line coverage'
            echo
            echo '```'
            awk '$1 == "TOTAL" { print "total", $10 }' coverage.txt
            echo
            echo 'Least covered:'
            # Column 10 is line coverage; the rows of the table are the ones ending in a dash.
            awk '$NF == "-" && $1 != "TOTAL" { print $10, $1 }' coverage.txt | sort -n | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt rather than `cargo install cargo-deny` from source: the from-source install cost
      # several minutes of every CI run and resolved a different version each time.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
