name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory against a dependency that has not changed produces no push and no PR, so a
  # push-only trigger never notices it. Weekly, the advisory job runs anyway.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    # Path resolution, timezone handling and the SQLite readers are all platform-sensitive,
    # and Windows in particular was broken for the entire life of the project because nothing
    # here ever compiled it.
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked

      - name: Smoke test the CLI against the fixture database
        shell: bash
        run: |
          cargo build --release --locked
          BIN=target/release/ai-usage-tui
          [ -f "$BIN" ] || BIN=target/release/ai-usage-tui.exe
          "$BIN" --version
          # Exercises path resolution end to end: this is the check that would have caught
          # "HOME is not set" on Windows.
          "$BIN" --json --db tests/fixtures/opencode_test.db --all > out.json
          head -c 400 out.json
          grep -q '"usage"' out.json
          # A reader that closes the pipe is a normal end to a pipeline, not a crash. This
          # used to abort with "failed printing to stdout: Broken pipe".
          "$BIN" --json --db tests/fixtures/opencode_test.db --all | head -c 200 > /dev/null
          "$BIN" --json --db tests/fixtures/opencode_test.db --all | grep -q '"usage"' 

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # A doc-only PR can break `cargo doc` (a bad intra-doc link) or a relative link between the
  # README and docs/. Both are cheap to check and neither was checked; the Omarchy split moved a
  # section between files and left two dangling anchors behind.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Relative links in Markdown resolve
        # The checker lives in scripts/ so that `just docs` and this job run the same code. It
        # used to be a 20-line Python heredoc here, which `just check` did not run at all.
        run: python3 scripts/check-markdown-links.py .

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prebuilt rather than `cargo install cargo-deny` from source: the from-source install cost
      # several minutes of every CI run and resolved a different version each time.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
