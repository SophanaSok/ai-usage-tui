# Optional configuration for ai-usage-tui.
# Command-line options take precedence over these values.

# db = "/home/user/.local/share/opencode/opencode.db"
# journal = "/home/user/.local/share/ai-usage-tui/usage.db"
refresh_interval = 30
# provider = "opencode"
# model = "gpt-5.6-luna"

# Background collectors (TUI mode only).
# --once/--json/--csv bypass these and use synchronous collection.
[collectors.opencode]
enabled = true
interval = 30

[collectors.journal]
enabled = true
interval = 60

[collectors.zen_pricing]
enabled = false
interval = 3600
