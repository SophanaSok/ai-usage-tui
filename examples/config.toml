# Optional configuration for ai-usage-tui.
# Command-line options take precedence over these values.

# db = "/home/user/.local/share/opencode/opencode.db"
# journal = "/home/user/.local/share/ai-usage-tui/usage.db"
# claude_dir = "/home/user/.claude/projects"
# codex_dir = "/home/user/.codex"   # $CODEX_HOME, else ~/.codex; sessions/ and archived_sessions/ beneath it
refresh_interval = 30
# days = 7
# provider = "opencode"
# model = "gpt-5.6-luna"

# Data sources. `enabled` and `interval` are keyed by the source's id; an id that is not a
# source is an error naming the ones that are.
#
# `enabled = false` switches a source off everywhere -- the dashboard and --once/--json/--csv
# alike. `interval` applies only to the dashboard's background polling; the one-shot paths read
# once and exit.
# Looking for a newer release.
#
# Off by default, and the only setting in this file that would let the tool reach the network
# outside an explicit --refresh-pricing / --refresh-zen. With it on, `--doctor` -- and only
# `--doctor` -- asks GitHub for the latest release tag. Never automatic, never on the dashboard's
# refresh path, no usage data sent.
#
# `--doctor` always reports which channel this binary came from and the exact command to upgrade
# it; that is read off the binary's own path and needs no network, so it is not gated on this.
#
# What the check finds is cached in the data directory, and the dashboard reads it once at
# startup to name a newer release in its header. That is the only way a user who never runs
# `--doctor` learns a release exists, and the cache is what keeps the header off the network.
[update]
check = false

[collectors.opencode]
enabled = true
interval = 30

[collectors.claude_code]
enabled = true
interval = 30
# billing = "auto"   # auto | subscription | api; auto reads the environment and ~/.claude.json
# config_json = "/home/user/.claude.json"   # Claude Code's config document, if not at the default

[collectors.codex]
enabled = true
interval = 30
# billing = "auto"   # auto | subscription | api; auto reads OPENAI_API_KEY / CODEX_API_KEY only

# Gemini CLI. Reads its OpenTelemetry log, which Gemini only writes when you enable it:
#   ~/.gemini/settings.json -> {"telemetry":{"enabled":true,"target":"local","outfile":"..."}}
# `ai-usage-tui --doctor` prints that line when the file is missing.
[collectors.gemini]
enabled = true
interval = 30
# billing = "auto"   # auto | subscription | api; auto reads GEMINI_API_KEY / GOOGLE_API_KEY

[collectors.journal]
enabled = true
interval = 60

[collectors.zen_pricing]
enabled = false
interval = 3600

# Budget alerts (checked on each TUI refresh and via --check-budgets).
# The header matters: without it an uncommented `webhook` lands in the collector
# table above and is silently ignored.
[budgets]
# webhook = "https://hooks.example.com/budget-alerts"

[[budgets.entry]]
scope = "global"
period = "monthly"
limit = 50.0
# warn = 75.0      # default 75%
# critical = 90.0  # default 90%

[[budgets.entry]]
scope = "provider"
name = "opencode"
period = "daily"
limit = 5.0

[[budgets.entry]]
scope = "model"
name = "gpt-5.6-sol"
period = "monthly"
limit = 20.0

# Omarchy's agents panel (Omarchy 4) writes one JSON record per agent with each
# subscription's rate-limit windows and plan label. Read-only; idle when absent.
[omarchy]
# dir = "/home/user/.local/state/omarchy/agents/usage"   # default: $XDG_STATE_HOME/omarchy/agents/usage
limits = true                            # `l` panel, header window, --json `limits`, billing signal
# records = ["opencode"]                 # what --omarchy-record writes: opencode (default), ollama
# balance = false                        # also draw a budget as the panel's prepaid ledger
# balance_budget = "global/monthly"      # which budget the ledger shows, as <scope>/<period>
