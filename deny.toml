# cargo-deny configuration.
#
# The lockfile is committed and nothing was watching it: ~300 packages, no advisory scanning,
# and a vendored SQLite whose CVEs only reach us through a rusqlite bump.

[advisories]
version = 2
# No ignores. RUSTSEC-2024-0436 (`paste`, unmaintained) was ignored here while ratatui 0.29
# pulled it in; ratatui 0.30 dropped the dependency and `paste` is no longer in the tree, so
# the exception is gone rather than left standing as stale text that reads like a live risk.
ignore = []

[licenses]
version = 2
# Every entry here is a license actually present in the dependency tree, and cargo-deny warns
# when one stops being. Keeping it exact means a new license type fails the build and gets
# reviewed, rather than passing unnoticed.
#
# `cargo deny list` also reports BSL-1.0 (ryu) and Unlicense (memchr, aho-corasick). Neither
# needs allowing: both are the second half of an `OR` expression already satisfied by
# Apache-2.0 or MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots — the Mozilla CA root store, shipped as data under a permissive data license.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
